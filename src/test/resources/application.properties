# テスト専用設定 - DB接続なしでインメモリ完結させる

# DataSource: H2インメモリDB（MySQL互換モード）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: テスト用スキーマは Hibernate に自動生成させる
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JPA open-in-view 無効
spring.jpa.open-in-view=false

# SQL初期化は使用しない
spring.sql.init.mode=never

# ログレベル（テスト中の不要なログを抑制）
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# DatabaseMigrator が schema-mysql.sql を読み込もうとするが、
# テスト時は H2 が ddl-auto=create-drop でスキーマを管理するため
# CommandLineRunner は起動しても H2 上の例外は setContinueOnError=true で無視される。
# 念のため H2 用の初期 SQL をスキップする
spring.h2.console.enabled=false
