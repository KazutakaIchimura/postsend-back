# 結合テスト（*IT）専用プロファイル。
# DataSourceの接続先（url/username/password）は @ServiceConnection が
# Testcontainers の MySQL コンテナ情報で上書きするため、ここでは指定しない。
# ddl-auto / dialect だけ MySQL 用に上書きし、本番と同じ DatabaseMigrator の
# schema-mysql.sql 実行 + ALTER TABLE 系マイグレーションを通す。

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never

logging.level.com.example.sendmail.config.DatabaseMigrator=INFO
